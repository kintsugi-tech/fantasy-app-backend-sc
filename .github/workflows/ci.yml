name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm hardhat build
      - run: pnpm tsc --noEmit
      - run: pnpm hardhat test --coverage
      - name: Encoding vectors are up to date
        run: pnpm vectors && git diff --exit-code test/vectors
